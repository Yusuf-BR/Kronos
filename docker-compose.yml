version: '3.8'

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: kronos-neo4j
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/kronos_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - kronos_neo4j_data:/data
      - kronos_neo4j_logs:/logs
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kronos-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - kronos_qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  kronos_neo4j_data:
  kronos_neo4j_logs:
  kronos_qdrant_data: